<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resident Login | My Home Boys PG</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,system-ui,sans-serif;color:#172033}.box{width:min(420px,calc(100% - 32px));background:#fff;padding:30px;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 40px rgba(15,23,42,.08)}.brand{font-weight:900;font-size:20px;margin-bottom:8px}.brand span{color:#2563eb}h1{margin:0 0 8px}p{color:#64748b}label{display:block;margin:15px 0 7px;font-size:13px;font-weight:700}input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:9px}button{width:100%;padding:12px;margin-top:20px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800}button:disabled{opacity:.6}#msg{display:none;margin-top:14px;padding:10px;border-radius:9px;font-size:13px}.err{display:block!important;background:#fee2e2;color:#991b1b}.ok{display:block!important;background:#dcfce7;color:#166534}.links{text-align:center;font-size:13px;margin-top:18px}a{color:#2563eb;text-decoration:none}</style></head>
<body><div class="box"><div class="brand">MY HOME <span>BOYS PG</span></div><h1>Resident Login</h1><p>Secure portal login</p>
<form id="f"><label>Email</label><input id="e" type="email" required><label>Password</label><input id="p" type="password" required><button id="b">Login</button></form><div id="msg"></div>
<div class="links"><a href="../admin/login.html">Admin Login</a> · <a href="../MyHomeBoysPG.html">Public Website</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
</script>
<script>
const f=document.getElementById("f"),b=document.getElementById("b"),m=document.getElementById("msg");
f.addEventListener("submit",async ev=>{ev.preventDefault();b.disabled=true;b.textContent="Signing in...";m.className="";m.style.display="none";
const {data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("e").value.trim(),password:document.getElementById("p").value});
if(error){m.textContent=error.message;m.className="err";b.disabled=false;b.textContent="Login";return;}
const {data:pr,error:pe}=await supabaseClient.from("profiles").select("role").eq("id",data.user.id).single();
if(pe||!pr||pr.role!=="resident"){await supabaseClient.auth.signOut();m.textContent="This account is not authorized for the resident portal.";m.className="err";b.disabled=false;b.textContent="Login";return;}
m.textContent="Login successful. Redirecting...";m.className="ok";location.href="../student/index.html";});
</script></body></html>
