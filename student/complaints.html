<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0;z-index:10}
.brand{font-size:20px;font-weight:800;padding:10px 12px 26px}.brand span{color:#60a5fa}
.nav{display:grid;gap:7px}.nav a{padding:12px 13px;border-radius:10px;color:#cbd5e1;font-size:14px;display:flex;gap:11px;align-items:center}.nav a:hover,.nav a.active{background:#1f2937;color:#fff}
.main{margin-left:250px;flex:1;padding:28px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.title h1{margin:0;font-size:28px}.title p{margin:6px 0 0;color:#64748b}
.user{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px 13px;font-weight:700}
.card{background:#fff;border:1px solid #e7ebf0;border-radius:15px;padding:19px;box-shadow:0 3px 15px rgba(15,23,42,.04)}
.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}
.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#3730a3}.btn:disabled{opacity:.55;cursor:not-allowed}
.muted{color:#64748b;font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field select,.field textarea{border:1px solid #dbe2ea;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eef2f6;text-align:left;font-size:13px}.table th{color:#64748b;font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.resolved{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.overdue{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1d4ed8}
.alert{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}.alert.error{background:#fee2e2;color:#991b1b}.alert.success{background:#dcfce7;color:#166534}
.mobile-toggle{display:none}
@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0;padding:18px}.form-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.mobile-toggle{display:block;position:fixed;left:12px;top:12px;z-index:20;border:0;background:#111827;color:#fff;border-radius:8px;padding:9px}.sidebar.open{width:250px;padding:22px 16px}}

/* ===== Responsive layout: desktop + tablet + mobile ===== */
html{width:100%;overflow-x:hidden}
body{width:100%;min-width:0;overflow-x:hidden}
img,video,iframe{max-width:100%;height:auto}
button,input,select,textarea{max-width:100%}
.app{width:100%;min-width:0}
.main{min-width:0;width:100%;max-width:none}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{max-width:100%}
.card{min-width:0;max-width:100%}
.form-grid{min-width:0}

/* Tablet */
@media (max-width:1000px){
  .sidebar{width:250px}
  .main{margin-left:250px;padding:22px}
  .topbar{flex-wrap:wrap}
  .topbar .user{margin-left:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Tablet portrait + mobile: sidebar becomes an overlay */
@media (max-width:900px){
  .sidebar{width:0;padding:0;overflow:hidden;box-shadow:none;transition:width .2s ease,box-shadow .2s ease}
  .sidebar.open{width:250px;padding:22px 16px;box-shadow:8px 0 30px rgba(0,0,0,.22)}
  .main{margin-left:0!important;padding:20px;min-width:0}
  .mobile-toggle{display:block!important;position:fixed;left:12px;top:12px;z-index:1001;border:0;background:#111827;color:#fff;border-radius:9px;padding:9px 11px;line-height:1;font-size:20px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .topbar{padding-left:48px}
}

/* Small phones */
@media (max-width:600px){
  .main{padding:14px}
  .topbar{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-bottom:18px}
  .topbar .user{margin-left:0;width:100%;text-align:left}
  .topbar .btn{width:100%;margin-left:0!important}
  .title h1{font-size:22px;line-height:1.2}
  .title p{font-size:13px;line-height:1.4}
  .grid,.form-grid{grid-template-columns:1fr!important;gap:12px}
  .card{padding:15px;border-radius:13px}
  .stat{font-size:25px}
  .section{margin-top:14px}
  .section-head{gap:10px;align-items:flex-start;flex-wrap:wrap}
  .section-head .btn,.section-head button{width:100%}
  .btn{min-height:42px;padding:10px 13px}
  .field input,.field select,.field textarea{width:100%;font-size:16px}
  .notice{padding:12px}
  .table{min-width:620px}
  .sidebar.open{width:min(250px,86vw)}
  .nav a{min-height:44px}
}

/* Very small phones */
@media (max-width:380px){
  .main{padding:10px}
  .card{padding:13px}
  .title h1{font-size:20px}
  .mobile-toggle{left:9px;top:9px}
  .topbar{padding-left:43px}
}

/* Prevent common fixed-width/modal layouts from overflowing */
.modal,.dialog,.popup,.modal-content,.dialog-content,.form-card,.panel{max-width:calc(100vw - 24px)}
@media (max-width:600px){
  .modal,.dialog,.popup{margin:10px auto!important}
  .modal-content,.dialog-content,.form-card,.panel{width:100%!important;max-width:100%!important}
}

/* ===== FINAL RESPONSIVE LAYER ===== */
html, body { max-width:100%; overflow-x:hidden; }
*, *::before, *::after { box-sizing:border-box; }
img, video, iframe { max-width:100%; height:auto; }
button, a, input, select, textarea { max-width:100%; }

@media (max-width:1023px){
  .sidebar{width:0 !important; padding:0 !important; overflow:hidden !important; box-shadow:none !important; transition:width .22s ease, box-shadow .22s ease;}
  .sidebar.open{width:min(250px,86vw) !important; padding:22px 16px !important; box-shadow:8px 0 30px rgba(0,0,0,.22) !important;}
  .main{margin-left:0 !important; min-width:0 !important; width:100%; max-width:100%;}
  .mobile-toggle{display:flex !important; align-items:center; justify-content:center; position:fixed !important; left:12px; top:12px; z-index:10001; width:44px; height:44px; border:0; background:#111827; color:#fff; border-radius:10px; padding:0; line-height:1; font-size:21px; box-shadow:0 3px 12px rgba(0,0,0,.18); cursor:pointer;}
  .topbar{padding-left:54px;}
  .nav a{min-height:44px;}
  .table-wrap{width:100%; max-width:100%; overflow-x:auto !important; -webkit-overflow-scrolling:touch;}
  .table{min-width:680px;}
  .actions, .modal-actions, .notice-actions, .date-filter { flex-wrap:wrap; }
  .actions button, .actions .btn, .modal-actions button, .modal-actions .btn { flex:0 0 auto; }
  .card, .section, .panel, .form-card { min-width:0; max-width:100%; }
  .modal{padding:12px !important; overflow-y:auto !important;}
  .modal-card{width:min(760px,100%) !important; max-width:100% !important;}
}

@media (max-width:767px){
  .main{padding:14px !important;}
  .topbar{display:flex; flex-direction:column; align-items:stretch; gap:12px; margin-bottom:18px; padding-left:54px;}
  .topbar > div:last-child{width:100%; display:flex !important; flex-wrap:wrap; gap:8px !important;}
  .topbar .user{margin-left:0 !important; flex:1 1 100%; width:100%;}
  .topbar .btn{flex:1 1 100%; width:100% !important; margin-left:0 !important;}
  .title h1{font-size:22px; line-height:1.2;}
  .title p{font-size:13px; line-height:1.45;}
  .grid, .form-grid{grid-template-columns:1fr !important; gap:12px;}
  .card{padding:15px; border-radius:13px;}
  .section-head{gap:10px; align-items:flex-start; flex-wrap:wrap;}
  .section-head > div{width:100%; display:flex !important; flex-wrap:wrap; gap:8px !important;}
  .section-head .btn, .section-head button{flex:1 1 100%; width:100%; min-height:44px;}
  .btn{min-height:44px; padding:10px 13px; white-space:normal;}
  .field input, .field select, .field textarea{width:100%; max-width:100%; font-size:16px;}
  .table-wrap{margin-right:0;}
  .table{min-width:680px;}
  .actions{display:flex !important; flex-wrap:wrap !important; gap:7px !important; min-width:190px;}
  .actions .btn, .actions button{display:inline-flex !important; visibility:visible !important; opacity:1 !important; min-height:40px; white-space:nowrap;}
  .modal-card{padding:15px !important;}
  .modal-actions{display:flex !important; flex-direction:column-reverse; gap:8px !important;}
  .modal-actions .btn, .modal-actions button{width:100% !important; min-height:44px;}
  .date-filter{display:flex; flex-direction:column; align-items:stretch !important;}
  .date-filter label, .date-filter input, .date-filter button, .date-result{width:100%; margin-left:0 !important; text-align:left;}
  .notice-actions{display:flex; flex-direction:column; gap:8px;}
  .notice-actions .btn, .notice-actions button{width:100%; min-height:44px;}
  .popup, .dialog, .modal, .modal-content, .dialog-content, .form-card, .panel{max-width:calc(100vw - 20px) !important;}
}

@media (max-width:380px){
  .main{padding:10px !important;}
  .mobile-toggle{left:9px; top:9px; width:42px; height:42px;}
  .topbar{padding-left:51px;}
  .table{min-width:640px;}
  .card{padding:13px;}
}

</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">MY HOME <span>BOYS PG</span></div>
<nav class="nav">
<a href="index.html">⌂ Dashboard</a>
<a href="profile.html">👤 My Profile</a>
<a href="room.html">🛏 My Room</a>

<a class="active" href="complaints.html">⚙ Complaints</a>
<a href="notices.html">🔔 Notices</a>

</nav>
<div style="position:absolute;bottom:22px;left:16px;right:16px"><a href="../index.html">← Public Website</a></div>
</aside>
<button class="mobile-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>

<main class="main">
<div class="topbar">
<div class="title"><h1>Complaints</h1><p>Submit an issue and track its status.</p></div>
<div style="display:flex;align-items:center;gap:8px">
<div class="user" id="studentName">Resident</div>
<button class="btn secondary" onclick="logout()">Logout</button>
</div>
</div>

<div id="message"></div>

<div class="card">
<div class="section-head"><h2>Submit Complaint</h2></div>
<form id="complaintForm">
<div class="form-grid">
<div class="field">
<label for="category">Category</label>
<select id="category" required>
<option value="Maintenance">Maintenance</option>
<option value="Cleanliness">Cleanliness</option>
<option value="Electricity">Electricity</option>
<option value="Water">Water</option>
<option value="Other">Other</option>
</select>
</div>
<div class="field">
<label for="room">Room</label>
<input id="room" value="Loading..." readonly>
</div>
<div class="field full">
<label for="description">Description</label>
<textarea id="description" placeholder="Describe the issue..." required></textarea>
</div>
</div>
<button class="btn" id="submitButton" type="submit" style="margin-top:14px">Submit Complaint</button>
</form>
</div>

<div class="section card">
<div class="section-head"><h2>My Complaints</h2></div>
<div class="table-wrap">
<table class="table">
<thead><tr><th>Issue</th><th>Description</th><th>Created</th><th>Status</th><th>Admin Response</th></tr></thead>
<tbody id="complaintsList"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
</table>
</div>
</div>
</main>
</div>

<script>
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: window.localStorage
    }
  }
);

let currentSession=null;

function escapeHtml(value){
  return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function formatDate(value){
  if(!value) return "—";
  const d=new Date(value);
  return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function statusClass(status){
  const s=String(status||"").toLowerCase();
  if(s==="resolved"||s==="closed") return "resolved";
  if(s==="pending"||s==="in progress"||s==="open") return "pending";
  return "info";
}
function showMessage(text,type){
  const box=document.getElementById("message");
  box.innerHTML=text?`<div class="alert ${type==="success"?"success":"error"}">${escapeHtml(text)}</div>`:"";
}

async function loadComplaints(){
  const {data,error}=await supabaseClient
    .from("complaints")
    .select("id,category,description,status,admin_response,created_at,resolved_at")
    .eq("student_id",currentSession.user.id)
    .order("created_at",{ascending:false});

  if(error) throw error;

  // Show all active complaints, but only the 5 most recently resolved.
  const active=(data||[]).filter(c=>{
    const s=String(c.status||"").toLowerCase();
    return s!=="resolved" && s!=="closed";
  });
  const resolved=(data||[])
    .filter(c=>{const s=String(c.status||"").toLowerCase(); return s==="resolved" || s==="closed";})
    .sort((a,b)=>new Date(b.resolved_at||b.created_at)-new Date(a.resolved_at||a.created_at))
    .slice(0,5);
  const visible=[...active,...resolved];

  const list=document.getElementById("complaintsList");
  if(!visible.length){
    list.innerHTML='<tr><td colspan="5" class="muted">No complaints submitted yet.</td></tr>';
    return;
  }

  list.innerHTML=visible.map(c=>`
    <tr>
      <td>${escapeHtml(c.category||"—")}</td>
      <td>${escapeHtml(c.description||"—")}</td>
      <td>${formatDate(c.created_at)}</td>
      <td><span class="badge ${statusClass(c.status)}">${escapeHtml(String(c.status||"Unknown").replace(/_/g," ").toUpperCase())}</span></td>
      <td>${escapeHtml(c.admin_response||"—")}</td>
    </tr>
  `).join("");
}

async function loadStudent(){
  const {data:profile,error}=await supabaseClient
    .from("profiles")
    .select("full_name,role,room_id")
    .eq("id",currentSession.user.id)
    .single();

  if(error || !profile || profile.role!=="resident"){
    await supabaseClient.auth.signOut();
    location.replace("login.html");
    return;
  }

  document.getElementById("studentName").textContent=profile.full_name||currentSession.user.email;

  if(profile.room_id){
    const {data:room}=await supabaseClient
      .from("rooms")
      .select("room_number")
      .eq("id",profile.room_id)
      .maybeSingle();
    document.getElementById("room").value=room?.room_number ? String(room.room_number) : "Assigned";
  }else{
    document.getElementById("room").value="Not assigned";
  }
}

document.getElementById("complaintForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const button=document.getElementById("submitButton");
  const category=document.getElementById("category").value;
  const description=document.getElementById("description").value.trim();

  if(!description){
    showMessage("Please describe the issue before submitting.","error");
    return;
  }

  button.disabled=true;
  button.textContent="Submitting...";

  const {error}=await supabaseClient.from("complaints").insert({
    student_id:currentSession.user.id,
    category,
    description
  });

  if(error){
    console.error(error);
    showMessage("Could not submit your complaint: "+(error.message||"Unknown error"),"error");
  }else{
    document.getElementById("description").value="";
    showMessage("Complaint submitted successfully.","success");
    await loadComplaints();
  }

  button.disabled=false;
  button.textContent="Submit Complaint";
});

async function logout(){
  await supabaseClient.auth.signOut();
  location.replace("login.html");
}

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.replace("login.html");return;}
  currentSession=session;
  try{
    await loadStudent();
    await loadComplaints();
  }catch(error){
    console.error(error);
    showMessage("Could not load your complaints: "+(error.message||"Unknown error"),"error");
    document.getElementById("complaintsList").innerHTML='<tr><td colspan="5" class="muted">Could not load complaints.</td></tr>';
  }
})();
</script>
<script>
(function(){
  const sidebar=document.getElementById('sidebar');
  const toggle=document.querySelector('.mobile-toggle');
  if(!sidebar||!toggle)return;
  toggle.setAttribute('aria-label','Open navigation');
  toggle.setAttribute('aria-expanded','false');
  function closeNav(){sidebar.classList.remove('open');toggle.setAttribute('aria-expanded','false');}
  function openNav(){sidebar.classList.add('open');toggle.setAttribute('aria-expanded','true');}
  toggle.addEventListener('click',function(){sidebar.classList.contains('open')?closeNav():openNav();});
  sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeNav));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});
  document.addEventListener('click',e=>{
    if(window.innerWidth<=900 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !toggle.contains(e.target)) closeNav();
  });
  window.addEventListener('resize',()=>{if(window.innerWidth>900)closeNav();});
})();
</script></body>
</html>
