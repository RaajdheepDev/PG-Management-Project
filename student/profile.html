<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">MY HOME <span>BOYS PG</span></div><nav class="nav"><a class="active" href="index.html">⌂ Dashboard</a><a class="" href="profile.html">👤 My Profile</a><a class="" href="room.html">🛏 My Room</a><a href="payments.html?v=20260914">💰 Payments</a><a class="" href="complaints.html">⚙ Complaints</a><a class="" href="notices.html">🔔 Notices</a><a class="" href="rules.html">📋 PG Rules</a></nav>

<main class="main"><div class="topbar"><div class="title"><h1>My Profile</h1><p>My Home Boys PG management portal</p></div><div class="user" >Resident</div><button class="btn secondary" style="margin-left:8px" onclick="logout()">Logout</button></div>
<div class="card">
<div class="section-head">
  <h2>My Profile</h2>
  <button class="btn" id="saveProfileBtn" type="button">Save Changes</button>
</div>
<div id="profileMessage" style="display:none;margin:0 0 14px;padding:11px 13px;border-radius:9px;font-size:13px;font-weight:700"></div>
<div class="form-grid">
  <div class="field"><label>Full Name</label><input id="fullName" type="text" placeholder="Full name"></div>
  <div class="field"><label>Phone</label><input id="phone" type="tel" placeholder="+91..."></div>
  <div class="field"><label>Email</label><input id="email" type="email" readonly style="background:#f8fafc;color:#64748b"></div>
  <div class="field"><label>Date of Birth</label><input id="dateOfBirth" type="date"></div>
  <div class="field full"><label>Address</label><textarea id="address" placeholder="Residential address"></textarea></div>
  <div class="field"><label>Emergency Contact</label><input id="emergencyContact" type="tel" placeholder="+91..."></div>
  <div class="field"><label>Relationship</label><input id="emergencyRelationship" type="text" placeholder="Parent, guardian, etc."></div>
</div>
</div>
</main></div>
<script>
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
</script><script>
let currentSession = null;

function showMessage(text, success=false) {
  const el = document.getElementById("profileMessage");
  if (!el) return;
  el.textContent = text;
  el.style.display = "block";
  el.style.background = success ? "#dcfce7" : "#fee2e2";
  el.style.color = success ? "#166534" : "#991b1b";
}

function setField(id, value) {
  const el = document.getElementById(id);
  if (el) el.value = value ?? "";
}

async function loadProfile() {
  const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

  if (sessionError || !session) {
    location.replace("login.html");
    return;
  }

  currentSession = session;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("full_name, phone, email, date_of_birth, address, emergency_contact, emergency_relationship, role")
    .eq("id", session.user.id)
    .single();

  if (error || !profile || profile.role !== "resident") {
    await supabaseClient.auth.signOut();
    location.replace("login.html");
    return;
  }

  setField("fullName", profile.full_name);
  setField("phone", profile.phone);
  setField("email", session.user.email || profile.email);
  setField("dateOfBirth", profile.date_of_birth);
  setField("address", profile.address);
  setField("emergencyContact", profile.emergency_contact);
  setField("emergencyRelationship", profile.emergency_relationship);

  const userBadge = document.querySelector(".user");
  if (userBadge) userBadge.textContent = profile.full_name || session.user.email || "Resident";
}

async function saveProfile() {
  if (!currentSession) return;

  const button = document.getElementById("saveProfileBtn");
  button.disabled = true;
  button.textContent = "Saving...";

  const payload = {
    full_name: document.getElementById("fullName").value.trim() || null,
    phone: document.getElementById("phone").value.trim() || null,
    date_of_birth: document.getElementById("dateOfBirth").value || null,
    address: document.getElementById("address").value.trim() || null,
    emergency_contact: document.getElementById("emergencyContact").value.trim() || null,
    emergency_relationship: document.getElementById("emergencyRelationship").value.trim() || null
  };

  const { error } = await supabaseClient
    .from("profiles")
    .update(payload)
    .eq("id", currentSession.user.id);

  if (error) {
    showMessage("Could not save profile: " + error.message);
  } else {
    showMessage("Profile updated successfully.", true);
    const userBadge = document.querySelector(".user");
    if (userBadge) userBadge.textContent = payload.full_name || currentSession.user.email || "Resident";
  }

  button.disabled = false;
  button.textContent = "Save Changes";
}

document.querySelectorAll(".nav a").forEach(a =>
  a.addEventListener("click", () => document.getElementById("sidebar").classList.remove("open"))
);

document.getElementById("saveProfileBtn").addEventListener("click", saveProfile);

loadProfile().catch(err => {
  console.error(err);
  showMessage("Unable to load your profile.");
});

async function logout() {
  await supabaseClient.auth.signOut();
  location.replace("login.html");
}
</script></body></html>
