<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PG Rules | My Home Boys PG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0;z-index:10}
.brand{font-size:20px;font-weight:800;padding:10px 12px 26px}.brand span{color:#60a5fa}.nav{display:grid;gap:7px}
.nav a{padding:12px 13px;border-radius:10px;color:#cbd5e1;font-size:14px;display:flex;gap:11px;align-items:center}.nav a:hover,.nav a.active{background:#1f2937;color:#fff}
.main{margin-left:250px;flex:1;padding:28px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.title h1{margin:0;font-size:28px}.title p{margin:6px 0 0;color:#64748b}.user{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px 13px;font-weight:700}
.card{background:#fff;border:1px solid #e7ebf0;border-radius:15px;padding:22px;box-shadow:0 3px 15px rgba(15,23,42,.04)}
.card h2{margin:0 0 17px;font-size:20px}.form-grid{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:end}
.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700;color:#334155}.field input{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:11px 12px;background:#fff;outline:none}
.btn{border:0;border-radius:9px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.55;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}.alert.error{background:#fee2e2;color:#991b1b}.alert.success{background:#dcfce7;color:#166534}
.section{margin-top:25px}.section h2{font-size:21px;margin:0 0 13px}
.rule-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:10px;display:flex;gap:16px;align-items:center}
.rule-num{min-width:38px;height:38px;border-radius:10px;background:#eef2ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-weight:800}
.rule-content{flex:1}.rule-text{font-size:15px;line-height:1.5}.rule-meta{font-size:12px;color:#94a3b8;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.inactive{opacity:.62}.status{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534}.status.off{background:#fee2e2;color:#991b1b}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-backdrop.show{display:flex}
.modal{width:min(600px,100%);background:#fff;border-radius:16px;padding:22px}.modal h2{margin:0 0 16px}
.modal .field{margin-bottom:14px}.modal input{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:11px 12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.mobile-toggle{display:none}
@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0;padding:18px}.form-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.mobile-toggle{display:block;position:fixed;left:12px;top:12px;z-index:20;border:0;background:#111827;color:#fff;border-radius:8px;padding:9px}.sidebar.open{width:250px;padding:22px 16px}.rule-card{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}}
.nav a[href*="payments.html"]{display:flex!important;visibility:visible!important;opacity:1!important}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">MY HOME <span>BOYS PG</span></div>
<nav class="nav"><a class="" href="index.html?v=20260914">⌂ Dashboard</a><a class="" href="students.html?v=20260914">👥 Residents</a><a class="" href="rooms.html?v=20260914">🛏 Rooms</a><a class="" href="payments.html?v=20260914">💰 Payments</a><a class="" href="complaints.html?v=20260914">⚙ Complaints</a><a class="" href="notices.html?v=20260914">🔔 Notices</a><a class="active" href="rules.html?v=20260914">📋 PG Rules</a><a class="" href="settings.html?v=20260914">⚙ Settings</a></nav>
<div style="position:absolute;bottom:22px;left:16px;right:16px"><a href="/">← Public Website</a></div>
</aside>
<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<main class="main">
<div class="topbar"><div class="title"><h1>PG Rules</h1><p>My Home Boys PG management portal</p></div><div style="display:flex;align-items:center;gap:8px"><div class="user" id="adminName">Admin</div><button class="btn secondary" onclick="logout()">Logout</button></div></div>
<div id="message"></div>

<div class="card">
<h2>Add Rule</h2>
<form id="addForm">
<div class="form-grid">
<div class="field"><label for="ruleNumber">Rule Number</label><input id="ruleNumber" type="number" min="1" placeholder="7" required></div>
<div class="field"><label for="ruleText">Rule</label><input id="ruleText" placeholder="Enter PG rule..." required></div>
<button class="btn" id="addButton" type="submit">Add Rule</button>
</div>
</form>
</div>

<div class="section">
<h2>Rules &amp; Regulations</h2>
<div id="rulesList">Loading...</div>
</div>
</main>
</div>

<div class="modal-backdrop" id="editBackdrop">
<div class="modal">
<h2>Edit Rule</h2>
<form id="editForm">
<div class="field"><label for="editNumber">Rule Number</label><input id="editNumber" type="number" min="1" required></div>
<div class="field"><label for="editText">Rule</label><input id="editText" required></div>
<div class="modal-actions"><button type="button" class="btn secondary" onclick="closeEdit()">Cancel</button><button type="submit" class="btn" id="editButton">Save Changes</button></div>
</form>
</div>
</div>

<script>document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let rules=[];let editingId=null;

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function showMessage(text,type){document.getElementById("message").innerHTML=text?`<div class="alert ${type==="success"?"success":"error"}">${escapeHtml(text)}</div>`:""}

async function loadRules(){
  const {data,error}=await supabaseClient.from("pg_rules").select("id,rule_number,rule_text,active,created_at").order("rule_number",{ascending:true});
  if(error)throw error;
  rules=data||[];
  const list=document.getElementById("rulesList");
  if(!rules.length){list.innerHTML='<div class="card">No rules found.</div>';return;}
  list.innerHTML=rules.map(r=>`
    <div class="rule-card ${r.active?"":"inactive"}">
      <div class="rule-num">${escapeHtml(r.rule_number)}</div>
      <div class="rule-content"><div class="rule-text">${escapeHtml(r.rule_text)}</div><div class="rule-meta"><span class="status ${r.active?"":"off"}">${r.active?"Active":"Inactive"}</span></div></div>
      <div class="actions">
        <button class="btn secondary" onclick="openEdit('${r.id}')">Edit</button>
        <button class="btn secondary" onclick="toggleRule('${r.id}')">${r.active?"Deactivate":"Activate"}</button>
        <button class="btn danger" onclick="deleteRule('${r.id}')">Delete</button>
      </div>
    </div>`).join("");
}

document.getElementById("addForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("addButton");b.disabled=true;b.textContent="Adding...";
  const number=Number(document.getElementById("ruleNumber").value);
  const text=document.getElementById("ruleText").value.trim();
  const {error}=await supabaseClient.from("pg_rules").insert({rule_number:number,rule_text:text,active:true});
  if(error){console.error(error);showMessage("Could not add rule: "+error.message,"error")}
  else{document.getElementById("addForm").reset();showMessage("Rule added successfully.","success");await loadRules()}
  b.disabled=false;b.textContent="Add Rule";
});

function openEdit(id){
  const r=rules.find(x=>x.id===id);if(!r)return;
  editingId=id;document.getElementById("editNumber").value=r.rule_number;document.getElementById("editText").value=r.rule_text||"";
  document.getElementById("editBackdrop").classList.add("show");
}
function closeEdit(){editingId=null;document.getElementById("editBackdrop").classList.remove("show")}

document.getElementById("editForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!editingId)return;
  const b=document.getElementById("editButton");b.disabled=true;b.textContent="Saving...";
  const {error}=await supabaseClient.from("pg_rules").update({
    rule_number:Number(document.getElementById("editNumber").value),
    rule_text:document.getElementById("editText").value.trim()
  }).eq("id",editingId);
  if(error){console.error(error);showMessage("Could not update rule: "+error.message,"error")}
  else{closeEdit();showMessage("Rule updated successfully.","success");await loadRules()}
  b.disabled=false;b.textContent="Save Changes";
});

async function toggleRule(id){
  const r=rules.find(x=>x.id===id);if(!r)return;
  const {error}=await supabaseClient.from("pg_rules").update({active:!r.active}).eq("id",id);
  if(error){console.error(error);showMessage("Could not change rule status: "+error.message,"error")}
  else{showMessage(`Rule ${r.active?"deactivated":"activated"} successfully.`,"success");await loadRules()}
}

async function deleteRule(id){
  const r=rules.find(x=>x.id===id);if(!r)return;
  if(!confirm(`Delete rule ${r.rule_number}?`))return;
  const {error}=await supabaseClient.from("pg_rules").delete().eq("id",id);
  if(error){console.error(error);showMessage("Could not delete rule: "+error.message,"error")}
  else{showMessage("Rule deleted successfully.","success");await loadRules()}
}

async function logout(){await supabaseClient.auth.signOut();location.replace("login.html")}

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.replace("login.html");return}
  const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",session.user.id).single();
  if(error||!profile||profile.role!=="admin"){await supabaseClient.auth.signOut();location.replace("login.html");return}
  document.getElementById("adminName").textContent="Admin";
  try{await loadRules()}catch(error){console.error(error);showMessage("Could not load rules: "+error.message,"error")}
})();
</script>
<script>
(function(){
  const nav=document.querySelector('.nav');
  if(!nav)return;
  let link=nav.querySelector('a[href*="payments"]');
  if(!link){
    link=document.createElement('a');
    link.href='payments.html?v=20260914';
    link.innerHTML='💰 Payments';
    nav.insertBefore(link, nav.children[3]||null);
  }
  link.style.display='flex';
  link.style.visibility='visible';
  link.style.opacity='1';
})();
</script></body>
</html>
