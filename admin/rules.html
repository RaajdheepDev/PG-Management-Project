<script>document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let rules=[];let editingId=null;

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function showMessage(text,type){document.getElementById("message").innerHTML=text?`<div class="alert ${type==="success"?"success":"error"}">${escapeHtml(text)}</div>`:""}

async function loadRules(){
  const {data,error}=await supabaseClient.from("pg_rules").select("id,rule_number,rule_text,active,created_at").order("rule_number",{ascending:true});
  if(error)throw error;
  rules=data||[];
  const list=document.getElementById("rulesList");
  if(!rules.length){list.innerHTML='<div class="card">No rules found.</div>';return;}
  list.innerHTML=rules.map(r=>`
    <div class="rule-card ${r.active?"":"inactive"}">
      <div class="rule-num">${escapeHtml(r.rule_number)}</div>
      <div class="rule-content"><div class="rule-text">${escapeHtml(r.rule_text)}</div><div class="rule-meta"><span class="status ${r.active?"":"off"}">${r.active?"Active":"Inactive"}</span></div></div>
      <div class="actions">
        <button class="btn secondary" onclick="openEdit('${r.id}')">Edit</button>
        <button class="btn secondary" onclick="toggleRule('${r.id}')">${r.active?"Deactivate":"Activate"}</button>
        <button class="btn danger" onclick="deleteRule('${r.id}')">Delete</button>
      </div>
    </div>`).join("");
}

document.getElementById("addForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("addButton");b.disabled=true;b.textContent="Adding...";
  const number=Number(document.getElementById("ruleNumber").value);
  const text=document.getElementById("ruleText").value.trim();
  const {error}=await supabaseClient.from("pg_rules").insert({rule_number:number,rule_text:text,active:true});
  if(error){console.error(error);showMessage("Could not add rule: "+error.message,"error")}
  else{document.getElementById("addForm").reset();showMessage("Rule added successfully.","success");await loadRules()}
  b.disabled=false;b.textContent="Add Rule";
});

function openEdit(id){
  const r=rules.find(x=>x.id===id);if(!r)return;
  editingId=id;document.getElementById("editNumber").value=r.rule_number;document.getElementById("editText").value=r.rule_text||"";
  document.getElementById("editBackdrop").classList.add("show");
}
function closeEdit(){editingId=null;document.getElementById("editBackdrop").classList.remove("show")}

document.getElementById("editForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!editingId)return;
  const b=document.getElementById("editButton");b.disabled=true;b.textContent="Saving...";
  const {error}=await supabaseClient.from("pg_rules").update({
    rule_number:Number(document.getElementById("editNumber").value),
    rule_text:document.getElementById("editText").value.trim()
  }).eq("id",editingId);
  if(error){console.error(error);showMessage("Could not update rule: "+error.message,"error")}
  else{closeEdit();showMessage("Rule updated successfully.","success");await loadRules()}
  b.disabled=false;b.textContent="Save Changes";
});

async function toggleRule(id){
  const r=rules.find(x=>x.id===id);if(!r)return;
  const {error}=await supabaseClient.from("pg_rules").update({active:!r.active}).eq("id",id);
  if(error){console.error(error);showMessage("Could not change rule status: "+error.message,"error")}
  else{showMessage(`Rule ${r.active?"deactivated":"activated"} successfully.`,"success");await loadRules()}
}

async function deleteRule(id){
  const r=rules.find(x=>x.id===id);if(!r)return;
  if(!confirm(`Delete rule ${r.rule_number}?`))return;
  const {error}=await supabaseClient.from("pg_rules").delete().eq("id",id);
  if(error){console.error(error);showMessage("Could not delete rule: "+error.message,"error")}
  else{showMessage("Rule deleted successfully.","success");await loadRules()}
}

async function logout(){await supabaseClient.auth.signOut();location.replace("login.html")}

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.replace("login.html");return}
  const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",session.user.id).single();
  if(error||!profile||profile.role!=="admin"){await supabaseClient.auth.signOut();location.replace("login.html");return}
  document.getElementById("adminName").textContent="Admin";
  try{await loadRules()}catch(error){console.error(error);showMessage("Could not load rules: "+error.message,"error")}
})();
</script>
<script>

</script><script>
(function(){
  const sidebar=document.getElementById('sidebar');
  const toggle=document.querySelector('.mobile-toggle');
  if(!sidebar||!toggle)return;
  toggle.setAttribute('aria-label','Open navigation');
  toggle.setAttribute('aria-expanded','false');
  function closeNav(){sidebar.classList.remove('open');toggle.setAttribute('aria-expanded','false');}
  function openNav(){sidebar.classList.add('open');toggle.setAttribute('aria-expanded','true');}
  toggle.addEventListener('click',function(){sidebar.classList.contains('open')?closeNav():openNav();});
  sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeNav));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});
  document.addEventListener('click',e=>{
    if(window.innerWidth<=900 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !toggle.contains(e.target)) closeNav();
  });
  window.addEventListener('resize',()=>{if(window.innerWidth>900)closeNav();});
})();
</script></body>
