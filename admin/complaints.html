<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let complaints=[];
let editingId=null;

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatDate(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function statusClass(v){const s=String(v||"").toLowerCase();if(s==="resolved"||s==="closed")return"resolved";if(s==="pending"||s==="in_progress"||s==="in progress"||s==="open")return"pending";return"info"}
function statusLabel(v){const s=String(v||"unknown");return s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
function showMessage(text,type){const box=document.getElementById("message");box.innerHTML=text?`<div class="alert ${type==="success"?"success":"error"}">${escapeHtml(text)}</div>`:""}

async function loadComplaints(){
  const {data,error}=await supabaseClient.from("complaints")
    .select("id,student_id,category,description,status,admin_response,created_at,resolved_at")
    .order("created_at",{ascending:false});
  if(error)throw error;

  // Keep every Pending/In Progress complaint visible, but limit resolved
  // history to the 50 most recently resolved complaints.
  const active=(data||[]).filter(c=>{
    const s=String(c.status||"").toLowerCase();
    return s!=="resolved" && s!=="closed";
  });
  const resolved=(data||[])
    .filter(c=>{const s=String(c.status||"").toLowerCase(); return s==="resolved" || s==="closed";})
    .sort((a,b)=>new Date(b.resolved_at||b.created_at)-new Date(a.resolved_at||a.created_at))
    .slice(0,50);
  complaints=[...active,...resolved];

  const ids=[...new Set(complaints.map(c=>c.student_id).filter(Boolean))];
  let profiles=[];
  if(ids.length){
    const res=await supabaseClient.from("profiles").select("id,full_name,room_id").in("id",ids);
    if(res.error)throw res.error;
    profiles=res.data||[];
  }
  const roomIds=[...new Set(profiles.map(p=>p.room_id).filter(Boolean))];
  let rooms=[];
  if(roomIds.length){
    const res=await supabaseClient.from("rooms").select("id,room_number").in("id",roomIds);
    if(res.error)throw res.error;
    rooms=res.data||[];
  }

  const profileMap=Object.fromEntries(profiles.map(p=>[p.id,p]));
  const roomMap=Object.fromEntries(rooms.map(r=>[r.id,r]));
  const tbody=document.getElementById("complaintsList");
  if(!complaints.length){tbody.innerHTML='<tr><td colspan="7" class="muted">No complaints submitted yet.</td></tr>';return;}

  tbody.innerHTML=complaints.map(c=>{
    const p=profileMap[c.student_id]; const r=p?roomMap[p.room_id]:null;
    return `<tr>
      <td>${escapeHtml(p?.full_name||"Unknown resident")}</td>
      <td>${escapeHtml(r?.room_number??"Not assigned")}</td>
      <td><strong>${escapeHtml(c.category||"—")}</strong></td>
      <td>${escapeHtml(c.description||"—")}</td>
      <td>${formatDate(c.created_at)}</td>
      <td><span class="badge ${statusClass(c.status)}">${escapeHtml(statusLabel(c.status))}</span></td>
      <td><button class="btn secondary" onclick="openModal('${c.id}')">Update</button></td>
    </tr>`;
  }).join("");
}

function openModal(id){
  const c=complaints.find(x=>x.id===id);if(!c)return;
  editingId=id;
  document.getElementById("modalMeta").textContent=`${c.category||"Complaint"} • ${formatDate(c.created_at)} • ${c.description||""}`;
  const status=String(c.status||"pending").toLowerCase();
  const normalizedStatus=status==="in progress"?"in_progress":status;
   document.getElementById("modalStatus").value=["pending","in_progress","resolved"].includes(normalizedStatus)?normalizedStatus:"pending";
  document.getElementById("modalResponse").value=c.admin_response||"";
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){editingId=null;document.getElementById("modalBackdrop").classList.remove("show")}

async function saveComplaint(){
  if(!editingId)return;
  const button=document.getElementById("saveButton");button.disabled=true;button.textContent="Saving...";
  let status=document.getElementById("modalStatus").value;
  const response=document.getElementById("modalResponse").value.trim();

  // If the admin responds to a Pending complaint without explicitly choosing
  // Resolved, move it to In Progress automatically.
  if(status==="pending" && response) status="in_progress";

  const update={status,admin_response:response||null};
  if(status==="resolved") update.resolved_at=new Date().toISOString();
  else if(status==="in_progress" || status==="pending") update.resolved_at=null;

  const {error}=await supabaseClient.from("complaints").update(update).eq("id",editingId);
  if(error){
    console.error(error);showMessage("Could not update the complaint: "+(error.message||"Unknown error"),"error");
  }else{
    closeModal();showMessage("Complaint updated successfully.","success");await loadComplaints();
  }
  button.disabled=false;button.textContent="Save Changes";
}

async function logout(){await supabaseClient.auth.signOut();location.replace("login.html")}

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.replace("login.html");return;}
  const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",session.user.id).single();
  if(error||!profile||profile.role!=="admin"){await supabaseClient.auth.signOut();location.replace("login.html");return;}
  document.getElementById("adminName").textContent=profile.full_name||session.user.email;
  try{await loadComplaints()}catch(error){console.error(error);showMessage("Could not load complaints: "+(error.message||"Unknown error"),"error");document.getElementById("complaintsList").innerHTML='<tr><td colspan="7" class="muted">Could not load complaints.</td></tr>'}
})();
</script>

(function(){
  const sidebar=document.getElementById('sidebar');
  const toggle=document.querySelector('.mobile-toggle');
  if(!sidebar||!toggle)return;
  toggle.setAttribute('aria-label','Open navigation');
  toggle.setAttribute('aria-expanded','false');
  function closeNav(){sidebar.classList.remove('open');toggle.setAttribute('aria-expanded','false');}
  function openNav(){sidebar.classList.add('open');toggle.setAttribute('aria-expanded','true');}
  toggle.addEventListener('click',function(){sidebar.classList.contains('open')?closeNav():openNav();});
  sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeNav));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});
  document.addEventListener('click',e=>{
    if(window.innerWidth<=900 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !toggle.contains(e.target)) closeNav();
  });
  window.addEventListener('resize',()=>{if(window.innerWidth>900)closeNav();});
})();
</script></body>
