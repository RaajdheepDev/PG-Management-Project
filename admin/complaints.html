<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0;z-index:10}
.brand{font-size:20px;font-weight:800;padding:10px 12px 26px}.brand span{color:#60a5fa}.nav{display:grid;gap:7px}
.nav a{padding:12px 13px;border-radius:10px;color:#cbd5e1;font-size:14px;display:flex;gap:11px;align-items:center}.nav a:hover,.nav a.active{background:#1f2937;color:#fff}
.main{margin-left:250px;flex:1;padding:28px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.title h1{margin:0;font-size:28px}.title p{margin:6px 0 0;color:#64748b}.user{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px 13px;font-weight:700}
.card{background:#fff;border:1px solid #e7ebf0;border-radius:15px;padding:19px;box-shadow:0 3px 15px rgba(15,23,42,.04)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}
.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#3730a3}.btn:disabled{opacity:.55;cursor:not-allowed}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eef2f6;text-align:left;font-size:13px;vertical-align:top}.table th{color:#64748b;font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.resolved{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.info{background:#dbeafe;color:#1d4ed8}.errorbadge{background:#fee2e2;color:#991b1b}
.alert{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}.alert.error{background:#fee2e2;color:#991b1b}.alert.success{background:#dcfce7;color:#166534}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-backdrop.show{display:flex}
.modal{width:min(560px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin:0 0 6px}.modal-meta{color:#64748b;font-size:13px;margin-bottom:18px}
.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:700;color:#475569}.field select,.field textarea{border:1px solid #dbe2ea;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.mobile-toggle{display:none}
@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0;padding:18px}.topbar{align-items:flex-start}.mobile-toggle{display:block;position:fixed;left:12px;top:12px;z-index:20;border:0;background:#111827;color:#fff;border-radius:8px;padding:9px}.sidebar.open{width:250px;padding:22px 16px}}
.nav a[href*="payments.html"]{display:flex!important;visibility:visible!important;opacity:1!important}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">MY HOME <span>BOYS PG</span></div>
<nav class="nav"><a class="" href="index.html?v=20260914">⌂ Dashboard</a><a class="" href="students.html?v=20260914">👥 Residents</a><a class="" href="rooms.html?v=20260914">🛏 Rooms</a><a class="" href="payments.html?v=20260914">💰 Payments</a><a class="active" href="complaints.html?v=20260914">⚙ Complaints</a><a class="" href="notices.html?v=20260914">🔔 Notices</a><a class="" href="rules.html?v=20260914">📋 PG Rules</a><a class="" href="settings.html?v=20260914">⚙ Settings</a></nav>
<div style="position:absolute;bottom:22px;left:16px;right:16px"><a href="/">← Public Website</a></div>
</aside>
<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<main class="main">
<div class="topbar"><div class="title"><h1>Complaints</h1><p>My Home Boys PG management portal</p></div><div style="display:flex;align-items:center;gap:8px"><div class="user" id="adminName">Admin</div><button class="btn secondary" onclick="logout()">Logout</button></div></div>
<div id="message"></div>
<div class="card">
<div class="section-head"><h2>Complaint Management</h2></div>
<div class="table-wrap">
<table class="table">
<thead><tr><th>Resident</th><th>Room</th><th>Issue</th><th>Description</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="complaintsList"><tr><td colspan="7" class="muted">Loading...</td></tr></tbody>
</table>
</div>
</div>
</main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
<div class="modal">
<h2>Update Complaint</h2>
<div class="modal-meta" id="modalMeta"></div>
<div class="field"><label for="modalStatus">Status</label>
<select id="modalStatus"><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="resolved">Resolved</option></select></div>
<div class="field"><label for="modalResponse">Admin Response</label><textarea id="modalResponse" placeholder="Enter your response to the resident..."></textarea></div>
<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" id="saveButton" onclick="saveComplaint()">Save Changes</button></div>
</div>
</div>

<script>
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let complaints=[];
let editingId=null;

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatDate(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function statusClass(v){const s=String(v||"").toLowerCase();if(s==="resolved"||s==="closed")return"resolved";if(s==="pending"||s==="in_progress"||s==="in progress"||s==="open")return"pending";return"info"}
function statusLabel(v){const s=String(v||"unknown");return s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
function showMessage(text,type){const box=document.getElementById("message");box.innerHTML=text?`<div class="alert ${type==="success"?"success":"error"}">${escapeHtml(text)}</div>`:""}

async function loadComplaints(){
  const {data,error}=await supabaseClient.from("complaints")
    .select("id,student_id,category,description,status,admin_response,created_at,resolved_at")
    .order("created_at",{ascending:false});
  if(error)throw error;

  // Keep every Pending/In Progress complaint visible, but limit resolved
  // history to the 50 most recently resolved complaints.
  const active=(data||[]).filter(c=>{
    const s=String(c.status||"").toLowerCase();
    return s!=="resolved" && s!=="closed";
  });
  const resolved=(data||[])
    .filter(c=>{const s=String(c.status||"").toLowerCase(); return s==="resolved" || s==="closed";})
    .sort((a,b)=>new Date(b.resolved_at||b.created_at)-new Date(a.resolved_at||a.created_at))
    .slice(0,50);
  complaints=[...active,...resolved];

  const ids=[...new Set(complaints.map(c=>c.student_id).filter(Boolean))];
  let profiles=[];
  if(ids.length){
    const res=await supabaseClient.from("profiles").select("id,full_name,room_id").in("id",ids);
    if(res.error)throw res.error;
    profiles=res.data||[];
  }
  const roomIds=[...new Set(profiles.map(p=>p.room_id).filter(Boolean))];
  let rooms=[];
  if(roomIds.length){
    const res=await supabaseClient.from("rooms").select("id,room_number").in("id",roomIds);
    if(res.error)throw res.error;
    rooms=res.data||[];
  }

  const profileMap=Object.fromEntries(profiles.map(p=>[p.id,p]));
  const roomMap=Object.fromEntries(rooms.map(r=>[r.id,r]));
  const tbody=document.getElementById("complaintsList");
  if(!complaints.length){tbody.innerHTML='<tr><td colspan="7" class="muted">No complaints submitted yet.</td></tr>';return;}

  tbody.innerHTML=complaints.map(c=>{
    const p=profileMap[c.student_id]; const r=p?roomMap[p.room_id]:null;
    return `<tr>
      <td>${escapeHtml(p?.full_name||"Unknown resident")}</td>
      <td>${escapeHtml(r?.room_number??"Not assigned")}</td>
      <td><strong>${escapeHtml(c.category||"—")}</strong></td>
      <td>${escapeHtml(c.description||"—")}</td>
      <td>${formatDate(c.created_at)}</td>
      <td><span class="badge ${statusClass(c.status)}">${escapeHtml(statusLabel(c.status))}</span></td>
      <td><button class="btn secondary" onclick="openModal('${c.id}')">Update</button></td>
    </tr>`;
  }).join("");
}

function openModal(id){
  const c=complaints.find(x=>x.id===id);if(!c)return;
  editingId=id;
  document.getElementById("modalMeta").textContent=`${c.category||"Complaint"} • ${formatDate(c.created_at)} • ${c.description||""}`;
  const status=String(c.status||"pending").toLowerCase();
  const normalizedStatus=status==="in progress"?"in_progress":status;
   document.getElementById("modalStatus").value=["pending","in_progress","resolved"].includes(normalizedStatus)?normalizedStatus:"pending";
  document.getElementById("modalResponse").value=c.admin_response||"";
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){editingId=null;document.getElementById("modalBackdrop").classList.remove("show")}

async function saveComplaint(){
  if(!editingId)return;
  const button=document.getElementById("saveButton");button.disabled=true;button.textContent="Saving...";
  let status=document.getElementById("modalStatus").value;
  const response=document.getElementById("modalResponse").value.trim();

  // If the admin responds to a Pending complaint without explicitly choosing
  // Resolved, move it to In Progress automatically.
  if(status==="pending" && response) status="in_progress";

  const update={status,admin_response:response||null};
  if(status==="resolved") update.resolved_at=new Date().toISOString();
  else if(status==="in_progress" || status==="pending") update.resolved_at=null;

  const {error}=await supabaseClient.from("complaints").update(update).eq("id",editingId);
  if(error){
    console.error(error);showMessage("Could not update the complaint: "+(error.message||"Unknown error"),"error");
  }else{
    closeModal();showMessage("Complaint updated successfully.","success");await loadComplaints();
  }
  button.disabled=false;button.textContent="Save Changes";
}

async function logout(){await supabaseClient.auth.signOut();location.replace("login.html")}

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.replace("login.html");return;}
  const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",session.user.id).single();
  if(error||!profile||profile.role!=="admin"){await supabaseClient.auth.signOut();location.replace("login.html");return;}
  document.getElementById("adminName").textContent=profile.full_name||session.user.email;
  try{await loadComplaints()}catch(error){console.error(error);showMessage("Could not load complaints: "+(error.message||"Unknown error"),"error");document.getElementById("complaintsList").innerHTML='<tr><td colspan="7" class="muted">Could not load complaints.</td></tr>'}
})();
</script>

(function(){
  const nav=document.querySelector('.nav');
  if(!nav)return;
  let link=nav.querySelector('a[href*="payments"]');
  if(!link){
    link=document.createElement('a');
    link.href='payments.html?v=20260914';
    link.innerHTML='💰 Payments';
    nav.insertBefore(link, nav.children[3]||null);
  }
  link.style.display='flex';
  link.style.visibility='visible';
  link.style.opacity='1';
})();
</script></body>
