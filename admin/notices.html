<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notices | My Home Boys PG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0;z-index:10}
.brand{font-size:20px;font-weight:800;padding:10px 12px 26px}.brand span{color:#60a5fa}.nav{display:grid;gap:7px}
.nav a{padding:12px 13px;border-radius:10px;color:#cbd5e1;font-size:14px;display:flex;gap:11px;align-items:center}.nav a:hover,.nav a.active{background:#1f2937;color:#fff}
.main{margin-left:250px;flex:1;padding:28px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.title h1{margin:0;font-size:28px}.title p{margin:6px 0 0;color:#64748b}.user{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px 13px;font-weight:700}
.card{background:#fff;border:1px solid #e7ebf0;border-radius:15px;padding:22px;box-shadow:0 3px 15px rgba(15,23,42,.04)}
.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-head h2{font-size:20px;margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#334155}
.field input,.field select,.field textarea{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:12px 13px;background:#fff;outline:none}.field textarea{min-height:125px;resize:vertical}
.btn{border:0;border-radius:9px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.55;cursor:not-allowed}
.notice-card{border:1px solid #e5e7eb;border-radius:12px;padding:17px;margin-top:12px;background:#fff}.notice-title{font-size:17px;font-weight:800;margin:0 0 7px}.notice-message{font-size:14px;line-height:1.55;color:#475569;white-space:pre-wrap}.notice-meta{margin-top:10px;font-size:12px;color:#94a3b8}.notice-actions{display:flex;gap:8px;margin-top:13px}
.alert{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}.alert.error{background:#fee2e2;color:#991b1b}.alert.success{background:#dcfce7;color:#166534}
.empty{color:#64748b;font-size:14px;padding:8px 0}.mobile-toggle{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-backdrop.show{display:flex}
.modal{width:min(600px,100%);background:#fff;border-radius:16px;padding:22px}.modal h2{margin:0 0 16px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.target-student{display:none}.target-student.show{display:grid}
@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0;padding:18px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{align-items:flex-start}.mobile-toggle{display:block;position:fixed;left:12px;top:12px;z-index:20;border:0;background:#111827;color:#fff;border-radius:8px;padding:9px}.sidebar.open{width:250px;padding:22px 16px}}
.nav a[href*="payments.html"]{display:flex!important;visibility:visible!important;opacity:1!important}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">MY HOME <span>BOYS PG</span></div>
<nav class="nav"><a class="" href="index.html?v=20260914">⌂ Dashboard</a><a class="" href="students.html?v=20260914">👥 Residents</a><a class="" href="rooms.html?v=20260914">🛏 Rooms</a><a class="" href="payments.html?v=20260914">💰 Payments</a><a class="" href="complaints.html?v=20260914">⚙ Complaints</a><a class="active" href="notices.html?v=20260914">🔔 Notices</a><a class="" href="rules.html?v=20260914">📋 PG Rules</a><a class="" href="settings.html?v=20260914">⚙ Settings</a></nav>
<div style="position:absolute;bottom:22px;left:16px;right:16px"><a href="/">← Public Website</a></div>
</aside>
<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<main class="main">
<div class="topbar"><div class="title"><h1>Notices</h1><p>My Home Boys PG management portal</p></div><div style="display:flex;align-items:center;gap:8px"><div class="user" id="adminName">Admin</div><button class="btn secondary" onclick="logout()">Logout</button></div></div>
<div id="message"></div>

<div class="card">
<div class="section-head"><h2>Create Notice</h2></div>
<form id="noticeForm">
<div class="form-grid">
<div class="field"><label for="title">Title</label><input id="title" placeholder="Notice title" required></div>
<div class="field"><label for="audience">Audience</label><select id="audience"><option value="students">All Residents</option><option value="specific_student">Specific Resident</option></select></div>
<div class="field target-student" id="targetStudentWrap"><label for="studentSelect">Select Resident</label><select id="studentSelect"><option value="">Select a student</option></select></div>
<div class="field full"><label for="noticeMessage">Message</label><textarea id="noticeMessage" placeholder="Write announcement..." required></textarea></div>
</div>
<button class="btn" id="publishButton" type="submit" style="margin-top:15px">Publish Notice</button>
</form>
</div>

<div class="section">
<h2 style="font-size:22px;margin:0 0 14px">Published Notices</h2>
<div id="noticesList"><div class="empty">Loading...</div></div>
</div>
</main>
</div>

<div class="modal-backdrop" id="editBackdrop">
<div class="modal">
<h2>Edit Notice</h2>
<form id="editForm">
<div class="field"><label for="editTitle">Title</label><input id="editTitle" required></div>
<div class="field" style="margin-top:14px"><label for="editAudience">Audience</label><select id="editAudience"><option value="students">All Residents</option><option value="specific_student">Specific Resident</option></select></div>
<div class="field target-student" id="editTargetStudentWrap" style="margin-top:14px"><label for="editStudentSelect">Select Resident</label><select id="editStudentSelect"><option value="">Select a student</option></select></div>
<div class="field" style="margin-top:14px"><label for="editMessage">Message</label><textarea id="editMessage" required></textarea></div>
<div class="modal-actions"><button type="button" class="btn secondary" onclick="closeEdit()">Cancel</button><button type="submit" class="btn" id="editSaveButton">Save Changes</button></div>
</form>
</div>
</div>

<script>document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let notices=[];let students=[];let editingId=null;

function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatDate(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function showMessage(text,type){document.getElementById("message").innerHTML=text?`<div class="alert ${type==="success"?"success":"error"}">${escapeHtml(text)}</div>`:""}

async function loadStudents(){
  const {data,error}=await supabaseClient.from("profiles").select("id,full_name").eq("role","resident").order("full_name",{ascending:true});
  if(error)throw error;
  students=data||[];
  const options='<option value="">Select a student</option>'+students.map(st=>`<option value="${st.id}">${escapeHtml(st.full_name||"Unnamed resident")}</option>`).join("");
  document.getElementById("studentSelect").innerHTML=options;
  document.getElementById("editStudentSelect").innerHTML=options;
}
function toggleStudentSelect(selectId,wrapId){
  const select=document.getElementById(selectId);
  const wrap=document.getElementById(wrapId);
  const specific=select.value==="specific_student";
  wrap.classList.toggle("show",specific);
  if(!specific) document.getElementById(selectId==="audience"?"studentSelect":"editStudentSelect").value="";
}
document.getElementById("audience").addEventListener("change",()=>toggleStudentSelect("audience","targetStudentWrap"));
document.getElementById("editAudience").addEventListener("change",()=>toggleStudentSelect("editAudience","editTargetStudentWrap"));

async function loadNotices(){
  const {data,error}=await supabaseClient.from("notices").select("id,title,message,audience,student_id,created_by,created_at").order("created_at",{ascending:false});
  if(error)throw error;
  notices=data||[];
  const list=document.getElementById("noticesList");
  if(!notices.length){list.innerHTML='<div class="card empty">No notices published yet.</div>';return;}
  list.innerHTML=notices.map(n=>`
    <article class="notice-card">
      <h3 class="notice-title">${escapeHtml(n.title||"Untitled notice")}</h3>
      <div class="notice-message">${escapeHtml(n.message||"")}</div>
      <div class="notice-meta">Audience: ${escapeHtml(n.audience==="students"?"All Residents":"Specific Resident")} ${n.audience==="specific_student" ? `· Resident: ${escapeHtml((students.find(st=>st.id===n.student_id)?.full_name)||"Selected Student")}` : ""} · Published ${formatDate(n.created_at)}</div>
      <div class="notice-actions">
        <button class="btn secondary" onclick="openEdit('${n.id}')">Edit</button>
        <button class="btn danger" onclick="deleteNotice('${n.id}')">Delete</button>
      </div>
    </article>`).join("");
}

document.getElementById("noticeForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const button=document.getElementById("publishButton");button.disabled=true;button.textContent="Publishing...";
  const {data:{session}}=await supabaseClient.auth.getSession();
  const audience=document.getElementById("audience").value;
  const studentId=document.getElementById("studentSelect").value;
  if(audience==="specific_student" && !studentId){
    showMessage("Please select a student for this notice.","error");
    button.disabled=false;button.textContent="Publish Notice";
    return;
  }
  const {error}=await supabaseClient.from("notices").insert({
    title:document.getElementById("title").value.trim(),
    message:document.getElementById("noticeMessage").value.trim(),
    audience:document.getElementById("audience").value,
    student_id:document.getElementById("audience").value==="specific_student" ? document.getElementById("studentSelect").value : null,
    created_by:session.user.id
  });
  if(error){console.error(error);showMessage("Could not publish notice: "+error.message,"error")}
  else{document.getElementById("noticeForm").reset();showMessage("Notice published successfully.","success");await loadNotices()}
  button.disabled=false;button.textContent="Publish Notice";
});

function openEdit(id){
  const n=notices.find(x=>x.id===id);if(!n)return;
  editingId=id;document.getElementById("editTitle").value=n.title||"";document.getElementById("editMessage").value=n.message||"";
  document.getElementById("editAudience").value=n.audience==="specific_student"?"specific_student":"students";
  document.getElementById("editStudentSelect").value=n.student_id||"";
  toggleStudentSelect("editAudience","editTargetStudentWrap");
  document.getElementById("editBackdrop").classList.add("show");
}
function closeEdit(){editingId=null;document.getElementById("editBackdrop").classList.remove("show")}

document.getElementById("editForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!editingId)return;
  const button=document.getElementById("editSaveButton");button.disabled=true;button.textContent="Saving...";
  const editAudience=document.getElementById("editAudience").value;
  const editStudentId=document.getElementById("editStudentSelect").value;
  if(editAudience==="specific_student" && !editStudentId){
    showMessage("Please select a student for this notice.","error");
    button.disabled=false;button.textContent="Save Changes";
    return;
  }
  const {error}=await supabaseClient.from("notices").update({
    title:document.getElementById("editTitle").value.trim(),
    message:document.getElementById("editMessage").value.trim(),
    audience:document.getElementById("editAudience").value,
    student_id:document.getElementById("editAudience").value==="specific_student" ? document.getElementById("editStudentSelect").value : null
  }).eq("id",editingId);
  if(error){console.error(error);showMessage("Could not update notice: "+error.message,"error")}
  else{closeEdit();showMessage("Notice updated successfully.","success");await loadNotices()}
  button.disabled=false;button.textContent="Save Changes";
});

async function deleteNotice(id){
  const n=notices.find(x=>x.id===id);if(!n)return;
  if(!confirm(`Delete "${n.title||"this notice"}"?`))return;
  const {error}=await supabaseClient.from("notices").delete().eq("id",id);
  if(error){console.error(error);showMessage("Could not delete notice: "+error.message,"error")}
  else{showMessage("Notice deleted successfully.","success");await loadNotices()}
}

async function logout(){await supabaseClient.auth.signOut();location.replace("login.html")}

(async()=>{
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.replace("login.html");return}
  const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",session.user.id).single();
  if(error||!profile||profile.role!=="admin"){await supabaseClient.auth.signOut();location.replace("login.html");return}
  document.getElementById("adminName").textContent="Admin";
  try{await loadStudents();await loadNotices()}catch(error){console.error(error);showMessage("Could not load notices: "+error.message,"error")}
})();
</script>
<script>
(function(){
  const nav=document.querySelector('.nav');
  if(!nav)return;
  let link=nav.querySelector('a[href*="payments"]');
  if(!link){
    link=document.createElement('a');
    link.href='payments.html?v=20260914';
    link.innerHTML='💰 Payments';
    nav.insertBefore(link, nav.children[3]||null);
  }
  link.style.display='flex';
  link.style.visibility='visible';
  link.style.opacity='1';
})();
</script></body>
</html>
