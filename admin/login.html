<body><div class="box"><div class="brand">MY HOME <span>BOYS PG</span></div><h1>Admin Login</h1><p>Secure portal login</p>
<form id="f"><label>Email</label><input id="e" type="email" required><label>Password</label><input id="p" type="password" required><button id="b">Login</button></form><div id="msg"></div>
<div class="links"><a href="../student/login.html">Resident Login</a> · <a href="../index.html">Public Website</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: window.localStorage
    }
  }
);
</script>
<script>
const f=document.getElementById("f"),b=document.getElementById("b"),m=document.getElementById("msg");
f.addEventListener("submit",async ev=>{ev.preventDefault();b.disabled=true;b.textContent="Signing in...";m.className="";m.style.display="none";
const {data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("e").value.trim(),password:document.getElementById("p").value});
if(error){m.textContent=error.message;m.className="err";b.disabled=false;b.textContent="Login";return;}
const {data:pr,error:pe}=await supabaseClient.from("profiles").select("role").eq("id",data.user.id).single();
if(pe||!pr||pr.role!=="admin"){await supabaseClient.auth.signOut();m.textContent="This account is not authorized for the admin portal.";m.className="err";b.disabled=false;b.textContent="Login";return;}
m.textContent="Login successful. Redirecting...";m.className="ok";location.href="../admin/index.html";});
</script><script>
(function(){
  const sidebar=document.getElementById('sidebar');
  const toggle=document.querySelector('.mobile-toggle');
  if(!sidebar||!toggle)return;
  toggle.setAttribute('aria-label','Open navigation');
  toggle.setAttribute('aria-expanded','false');
  function closeNav(){sidebar.classList.remove('open');toggle.setAttribute('aria-expanded','false');}
  function openNav(){sidebar.classList.add('open');toggle.setAttribute('aria-expanded','true');}
  toggle.addEventListener('click',function(){sidebar.classList.contains('open')?closeNav():openNav();});
  sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeNav));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});
  document.addEventListener('click',e=>{
    if(window.innerWidth<=900 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !toggle.contains(e.target)) closeNav();
  });
  window.addEventListener('resize',()=>{if(window.innerWidth>900)closeNav();});
})();
</script></body></html>
