<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings | My Home Boys PG</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0;z-index:10}
.brand{font-size:20px;font-weight:800;padding:10px 12px 26px}
.brand span{color:#60a5fa}
.nav{display:grid;gap:7px}
.nav a{padding:12px 13px;border-radius:10px;color:#cbd5e1;font-size:14px;display:flex;gap:11px;align-items:center}
.nav a:hover,.nav a.active{background:#1f2937;color:#fff}
.main{margin-left:250px;flex:1;padding:28px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.title h1{margin:0;font-size:28px}.title p{margin:6px 0 0;color:#64748b}
.user{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px 13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid #e7ebf0;border-radius:15px;padding:19px;box-shadow:0 3px 15px rgba(15,23,42,.04)}
.stat-label{color:#64748b;font-size:13px}.stat{font-size:28px;font-weight:800;margin-top:7px}.muted{color:#64748b;font-size:13px}
.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}
.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#b91c1c}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eef2f6;text-align:left;font-size:13px}.table th{color:#64748b;font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.paid,.resolved{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.overdue{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1d4ed8}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field select,.field textarea{border:1px solid #dbe2ea;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}
.notice{padding:14px;border:1px solid #e5e7eb;border-radius:11px;background:#fff;margin-bottom:10px}.notice strong{display:block;margin-bottom:5px}.notice small{color:#64748b}
.mobile-toggle{display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0;padding:18px}.grid,.form-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.mobile-toggle{display:block;position:fixed;left:12px;top:12px;z-index:20;border:0;background:#111827;color:#fff;border-radius:8px;padding:9px}.sidebar.open{width:250px;padding:22px 16px}.sidebar.open~.main{margin-left:0}}
.nav a[href*="payments.html"]{display:flex!important;visibility:visible!important;opacity:1!important}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">MY HOME <span>BOYS PG</span></div><nav class="nav"><a class="" href="index.html?v=20260914">⌂ Dashboard</a><a class="" href="students.html?v=20260914">👥 Residents</a><a class="" href="rooms.html?v=20260914">🛏 Rooms</a><a class="" href="payments.html?v=20260914">💰 Payments</a><a class="" href="complaints.html?v=20260914">⚙ Complaints</a><a class="" href="notices.html?v=20260914">🔔 Notices</a><a class="" href="rules.html?v=20260914">📋 PG Rules</a><a class="active" href="settings.html?v=20260914">⚙ Settings</a></nav>
<div style="position:absolute;bottom:22px;left:16px;right:16px"><a href="/">Public Website</a></div></aside>
<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<main class="main"><div class="topbar"><div class="title"><h1>Settings</h1><p>My Home Boys PG management portal</p></div><div><span class="user">Admin</span><button class="btn secondary" style="margin-left:8px" onclick="logout()">Logout</button></div></div>
<div class="card"><h2>PG Settings</h2><div id="msg" style="display:none;margin:12px 0;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:700"></div><div class="form-grid">
<div class="field"><label>PG Name</label><input id="pgName" value="My Home Boys PG" required></div><div class="field"><label>PG Contact Name</label><input id="adminName" value="PG Admin"></div>
<div class="field full"><label>PG Address</label><textarea id="pgAddress" placeholder="Enter PG address"></textarea></div>
<div class="field"><label>PG Contact Phone <span style="font-weight:500;color:#94a3b8">(optional)</span></label><input id="adminPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="Leave blank if not needed"></div>
</div>
<div style="margin-top:24px;border-top:1px solid #eef2f6;padding-top:20px">
  <h3 style="margin:0 0 6px;font-size:16px">Room Pricing</h3>
  <p class="muted" style="margin:0 0 14px">Monthly fees used by the payment system for each sharing type.</p>
  <div class="form-grid">
    <div class="field"><label>1 Sharing — Monthly Fee</label><input id="fee1" type="number" min="1" step="1" required></div>
    <div class="field"><label>2 Sharing — Monthly Fee</label><input id="fee2" type="number" min="1" step="1" required></div>
    <div class="field"><label>3 Sharing — Monthly Fee</label><input id="fee3" type="number" min="1" step="1" required></div>
  </div>
</div>
<button id="saveBtn" class="btn" style="margin-top:14px" onclick="saveSettings()">Save Settings</button></div>
</main></div>
<script>
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')));
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lfbzmllqmqcnerqkqroa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-hgZczEPq-EZ53N4cbXSXA_Y__0s8Wu";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentSession=null;

function showMessage(text,ok=false){
  const el=document.getElementById('msg');
  el.textContent=text; el.style.display='block';
  el.style.background=ok?'#dcfce7':'#fee2e2'; el.style.color=ok?'#166534':'#991b1b';
}

async function loadSettings(){
  const {data,error}=await supabaseClient.from('pg_settings').select('*').eq('id',1).maybeSingle();
  if(error){showMessage('Could not load PG settings: '+error.message);return;}
  if(!data)return;
  document.getElementById('pgName').value=data.pg_name||'';
  document.getElementById('pgAddress').value=data.pg_address||'';
  document.getElementById('adminName').value=data.admin_name||'';
  document.getElementById('adminPhone').value=data.admin_phone||'';
  const {data:pricing,error:pricingError}=await supabaseClient.from('room_type_pricing').select('room_type,monthly_fee');
  if(pricingError){showMessage('Could not load room pricing: '+pricingError.message);return;}
  const fees={}; (pricing||[]).forEach(r=>fees[r.room_type]=r.monthly_fee);
  document.getElementById('fee1').value=fees['1 Sharing']??10000;
  document.getElementById('fee2').value=fees['2 Sharing']??9000;
  document.getElementById('fee3').value=fees['3 Sharing']??8000;
}

async function saveSettings(){
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='Saving...';
  const payload={
    id:1,
    pg_name:document.getElementById('pgName').value.trim(),
    pg_address:document.getElementById('pgAddress').value.trim(),
    admin_name:document.getElementById('adminName').value.trim(),
    admin_phone:document.getElementById('adminPhone').value.trim(),
    updated_at:new Date().toISOString()
  };
  if(!payload.pg_name){showMessage('PG Name is required.');btn.disabled=false;btn.textContent='Save Settings';return;}
  const phone=payload.admin_phone.replace(/\D/g,'');
  if(payload.admin_phone && !/^\d{10}$/.test(phone)){showMessage('PG Contact Phone must contain exactly 10 digits, or be left blank.');btn.disabled=false;btn.textContent='Save Settings';return;}
  const fees=[['1 Sharing','fee1'],['2 Sharing','fee2'],['3 Sharing','fee3']];
  for(const [type,id] of fees){const fee=Number(document.getElementById(id).value);if(!Number.isFinite(fee)||fee<=0){showMessage(type+' monthly fee must be greater than 0.');btn.disabled=false;btn.textContent='Save Settings';return;}}
  const {error}=await supabaseClient.from('pg_settings').upsert(payload,{onConflict:'id'});
  if(error){showMessage('Could not save settings: '+error.message);btn.disabled=false;btn.textContent='Save Settings';return;}
  for(const [type,id] of fees){
    const {error:feeError}=await supabaseClient.from('room_type_pricing').upsert({room_type:type,monthly_fee:Number(document.getElementById(id).value)},{onConflict:'room_type'});
    if(feeError){showMessage('Could not save room pricing: '+feeError.message);btn.disabled=false;btn.textContent='Save Settings';return;}
  }
  showMessage('Settings saved successfully.',true);
  btn.disabled=false;btn.textContent='Save Settings';
}

(async()=>{
  const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError||!session){location.replace('login.html');return;}
  currentSession=session;
  const {data:profile,error}=await supabaseClient.from('profiles').select('full_name,role').eq('id',session.user.id).single();
  if(error||!profile||profile.role!=='admin'){
    await supabaseClient.auth.signOut();location.replace('login.html');return;
  }
  const u=document.querySelector('.user');if(u)u.textContent=profile.full_name||session.user.email;
  await loadSettings();
})();

async function logout(){await supabaseClient.auth.signOut();location.replace('login.html');}
</script><script>
</script></body></html>
